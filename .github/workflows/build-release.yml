name: Build downloadable client and Linux server

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Public GitHub Release tag, for example v1.0.0"
        required: true
        type: string
      server_endpoint:
        description: "Public VPS host:port, for example chess.example.com:8888"
        required: true
        type: string

permissions:
  contents: write

jobs:
  phase3-gate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Transport, SQL fencing and worker failover release gate
        shell: pwsh
        env:
          MATCH_TEST_MYSQL: 'Server=127.0.0.1;Port=3306;User ID=root;Password=;SslMode=None;Pooling=false'
        run: ./scripts/phase3/verify.ps1
      - name: Real TLS and MySQL capacity benchmark
        shell: pwsh
        env:
          MATCH_TEST_MYSQL: 'Server=127.0.0.1;Port=3306;User ID=root;Password=;SslMode=None;Pooling=false'
        run: ./scripts/phase3/verify.ps1 -Benchmark -NoBuild
      - name: Save commit-tagged TRX and measured samples, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-evidence-${{ github.sha }}
          path: artifacts/phase3/
          if-no-files-found: error

  client:
    needs: phase3-gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Download official Stockfish binary
        shell: pwsh
        run: ./scripts/setup-stockfish.ps1
      - name: Test chess and Stockfish integration
        shell: pwsh
        run: dotnet test Tests/ChessTests/ChessTests.csproj --configuration Release
      - name: Test Caro engine
        shell: pwsh
        run: dotnet test Tests/CaroTests/CaroTests.csproj --configuration Release
      - name: Deterministic Windows client recovery smoke (not live TLS or LAN acceptance)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/client-recovery | Out-Null
          dotnet run --project Tests/ClientRecoverySmoke/ClientRecoverySmoke.csproj --configuration Release 2>&1 | Tee-Object -FilePath artifacts/client-recovery/client-recovery-smoke.log
          if ($LASTEXITCODE -ne 0) { throw "ClientRecoverySmoke failed with exit code $LASTEXITCODE" }
      - name: Retain Windows recovery smoke log including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-recovery-smoke-${{ github.sha }}
          path: artifacts/client-recovery/client-recovery-smoke.log
          if-no-files-found: error
      - name: Publish self-contained Windows client
        shell: pwsh
        run: dotnet publish Design/OnlineChessGame.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false --output release/client
      - name: Add deployment settings and verify package
        shell: pwsh
        env:
          RELEASE_ENDPOINT: ${{ inputs.server_endpoint }}
        run: |
          if ($env:RELEASE_ENDPOINT -notmatch '^[^:\s/]+:[0-9]{1,5}$') { throw 'server_endpoint must be host:port' }
          $config = @{ endpoint = $env:RELEASE_ENDPOINT }
          $config | ConvertTo-Json | Set-Content -Path release/client/client-config.json -Encoding utf8
          if (-not (Test-Path release/client/Engines/Stockfish/stockfish.exe)) { throw 'Stockfish binary is missing from publish output' }
          if (-not (Test-Path release/client/Engines/Stockfish/Copying.txt)) { throw 'Stockfish license is missing from publish output' }
          if (-not (Test-Path release/client/OnlineChessGame.exe)) { throw 'Client executable is missing from publish output' }
          Compress-Archive -Path release/client/* -DestinationPath release/OnlineChessGame-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OnlineChessGame-Windows-x64
          path: release/OnlineChessGame-Windows-x64.zip
          if-no-files-found: error

  server:
    needs: phase3-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained Linux auth server
        run: dotnet publish Server/OnlineChessGame.Server.csproj --configuration Release --runtime linux-x64 --self-contained true --output release/server
      - name: Add server configuration template
        run: |
          cp docs/server.env.example release/server/server.env.example
          tar -czf release/OnlineChessGame-Server-Linux-x64.tar.gz -C release/server .
      - uses: actions/upload-artifact@v4
        with:
          name: OnlineChessGame-Server-Linux-x64
          path: release/OnlineChessGame-Server-Linux-x64.tar.gz
          if-no-files-found: error

  release:
    needs: [client, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: OnlineChessGame-*
          path: release
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'release_tag must look like v1.0.0' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release/OnlineChessGame-Windows-x64.zip release/OnlineChessGame-Server-Linux-x64.tar.gz \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Online Chess Game $RELEASE_TAG" \
            --notes 'Windows client includes .NET and Stockfish. Deploy the Linux server first and configure its local .env file.'
